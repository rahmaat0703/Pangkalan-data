<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pelanggaran - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
       <a class="navbar-brand" href="/pegawai/dashboard">
                <img src="/img/logo.png" alt="Logo Balai Bahasa Lampung" class="brand-logo">

            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/data-pegawai">Data Pegawai</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/verifikasi-izin">Verifikasi Izin</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/pelanggaran">Catatan khusus</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/konsultasi">Daftar Permohonan</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/laporan">Laporan</a></li>
                </ul>
                <div class="d-flex align-items-center ms-3" id="userInfo"></div>
            </div>
        </div>
    </nav>

    <div class="container-fluid my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>⚠️ Data Catatan Khusus Pegawai</h2>
            <button class="btn btn-danger" onclick="showTambahModal()">
                ➕ Tambah Catatan
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Pegawai</th>
                                <th>NIP</th>
                                <th>Jabatan</th>
                                <th>Jenis Pelanggaran</th>
                                <th>Tanggal</th>
                                <th>Deskripsi</th>
                                <th>Sanksi</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="pelanggaranTable">
                            <tr><td colspan="9" class="text-center"><div class="spinner-border text-primary"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tambah Pelanggaran -->
    <div class="modal fade" id="pelanggaranModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Catatan Khusus</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="pelanggaranForm">
                        <div class="mb-3">
                            <label class="form-label">Pegawai<span class="text-danger">*</span></label>
                            <select class="form-select" name="karyawan_id" id="pegawaiSelect" required>
                                <option value="">-- Pilih pegawai --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis Pelanggaran <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="jenis_pelanggaran" placeholder="Contoh: Terlambat, Tidak masuk tanpa keterangan" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tanggal <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" name="tanggal" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="deskripsi" rows="3" placeholder="Jelaskan detail pelanggaran" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Sanksi <span class="text-danger">*</span></label>
                            <textarea class="form-control" name="sanksi" rows="2" placeholder="Sanksi yang diberikan" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-danger" onclick="simpanPelanggaran()">💾 Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        let modalInstance;

        window.addEventListener('DOMContentLoaded', async function() {
            const user = await checkAuth();
            if (!user || user.role !== 'admin') {
                window.location.href = '/login';
                return;
            }
            loadUserInfo();
            loadPelanggaran();
            loadPegawaiDropdown();
            modalInstance = new bootstrap.Modal(document.getElementById('pelanggaranModal'));
        });

        async function loadPegawaiDropdown() {
            try {
                const response = await fetch('/api/admin/pegawai');
                const result = await response.json();
                
                if (result.success) {
                    const select = document.getElementById('pegawaiSelect');
                    result.data.forEach(k => {
                        const option = document.createElement('option');
                        option.value = k.id;
                        option.textContent = `${k.nama} (${k.nip})`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading pegawai:', error);
            }
        }

        async function loadPelanggaran() {
            try {
                const response = await fetch('/api/admin/pelanggaran');
                const result = await response.json();
                if (result.success) {
                    displayPelanggaran(result.data);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('pelanggaranTable').innerHTML = `
                    <tr><td colspan="9" class="text-center text-danger">Gagal memuat data</td></tr>
                `;
            }
        }

        function displayPelanggaran(data) {
            const tbody = document.getElementById('pelanggaranTable');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">Belum ada data pelanggaran</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((item, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${item.nama_pegawai}</strong></td>
                    <td>${item.nip}</td>
                    <td><small>${item.jabatan || '-'}</small></td>
                    <td><span class="badge bg-danger">${item.jenis_pelanggaran}</span></td>
                    <td>${formatTanggal(item.tanggal)}</td>
                    <td><small>${item.deskripsi}</small></td>
                    <td><small>${item.sanksi}</small></td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="hapusPelanggaran(${item.id})">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        function showTambahModal() {
            document.getElementById('pelanggaranForm').reset();
            
            // Set tanggal hari ini sebagai default
            const today = new Date().toISOString().split('T')[0];
            document.querySelector('[name="tanggal"]').value = today;
            
            modalInstance.show();
        }

        async function simpanPelanggaran() {
            const form = document.getElementById('pelanggaranForm');
            
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/api/admin/pelanggaran', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    showAlert(result.message, 'success');
                    modalInstance.hide();
                    loadPelanggaran();
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Terjadi kesalahan', 'danger');
            }
        }

        async function hapusPelanggaran(id) {
            if (!confirmDelete('Apakah Anda yakin ingin menghapus data pelanggaran ini?')) return;

            try {
                const response = await fetch(`/api/admin/pelanggaran/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showAlert(result.message, 'success');
                    loadPelanggaran();
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Terjadi kesalahan', 'danger');
            }
        }
    </script>
</body>
</html>
