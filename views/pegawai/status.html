<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Izin - Balai Bahasa Lampung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
             <a class="navbar-brand" href="/pegawai/dashboard">
                <img src="/img/logo.png" alt="Logo Balai Bahasa Lampung" class="brand-logo">
           
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/pegawai/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/profil">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/izin">Izin Keluar-Masuk</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pegawai/status">Status Izin</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/ganti-password">Ganti Password</a></li>
                </ul>
                <div class="d-flex align-items-center ms-3" id="userInfo"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid my-4">
        <h2 class="mb-4">📋 Status Izin Keluar-Masuk</h2>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Tanggal</th>
                                <th>Jam Keluar</th>
                                <th>Jam Kembali</th>
                                <th>Keterangan</th>
                                <th>Status</th>
                                <th>Catatan Admin</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="izinTable">
                            <tr>
                                <td colspan="8" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Input Jam Kembali -->
    <div class="modal fade" id="jamKembaliModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Input Jam Kembali</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="jamKembaliForm">
                        <input type="hidden" id="izinId">
                        <div class="mb-3">
                            <label class="form-label">Jam Kembali <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" id="jamKembali" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" onclick="simpanJamKembali()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        let modalInstance;

        window.addEventListener('DOMContentLoaded', async function() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login';
                return;
            }
            
            loadUserInfo();
            loadIzin();
            
            modalInstance = new bootstrap.Modal(document.getElementById('jamKembaliModal'));
        });

        async function loadIzin() {
            try {
                const response = await fetch('/api/pegawai/izin');
                const result = await response.json();

                if (result.success) {
                    displayIzin(result.data);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('izinTable').innerHTML = `
                    <tr><td colspan="8" class="text-center text-danger">Gagal memuat data</td></tr>
                `;
            }
        }

        function displayIzin(data) {
            const tbody = document.getElementById('izinTable');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">Belum ada data izin</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${formatTanggal(item.tanggal)}</td>
                    <td>${formatWaktu(item.jam_keluar)}</td>
                    <td>${formatWaktu(item.jam_kembali)}</td>
                    <td>${item.keterangan}</td>
                    <td><span class="badge ${getStatusBadgeClass(item.status)}">${item.status}</span></td>
                    <td>${item.catatan_admin || '-'}</td>
                    <td>
                        ${!item.jam_kembali ? 
                            `<button class="btn btn-sm btn-success" onclick="showJamKembaliModal(${item.id})">
                                Input Jam Kembali
                            </button>` : 
                            '<span class="text-muted">-</span>'
                        }
                    </td>
                </tr>
            `).join('');
        }

        function showJamKembaliModal(id) {
            document.getElementById('izinId').value = id;
            
            // Set jam sekarang sebagai default
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('jamKembali').value = `${hours}:${minutes}`;
            
            modalInstance.show();
        }

        async function simpanJamKembali() {
            const izinId = document.getElementById('izinId').value;
            const jamKembali = document.getElementById('jamKembali').value;

            if (!jamKembali) {
                showAlert('Jam kembali harus diisi', 'danger');
                return;
            }

            try {
                const response = await fetch(`/api/pegawai/izin/${izinId}/kembali`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ jam_kembali: jamKembali })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Jam kembali berhasil dicatat', 'success');
                    modalInstance.hide();
                    loadIzin();
                } else {
                    showAlert(result.message || 'Gagal menyimpan jam kembali', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Terjadi kesalahan saat menyimpan data', 'danger');
            }
        }
    </script>
</body>
</html>
