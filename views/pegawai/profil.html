<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Balai Bahasa Lampung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pegawai/dashboard">
                <img src="/img/logo.png" alt="Logo Balai Bahasa Lampung" class="brand-logo">
                
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/pegawai/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pegawai/profil">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/izin">Izin Keluar-Masuk</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/status">Status Izin</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/ganti-password">Ganti Password</a></li>
                </ul>
                <div class="d-flex align-items-center ms-3" id="userInfo"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">👤 Profil Saya</h4>
                    </div>
                    <div class="card-body" id="profilContent">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        let currentData = null;

        window.addEventListener('DOMContentLoaded', async function() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login';
                return;
            }
            
            loadUserInfo();
            loadProfil();
        });

        async function loadProfil() {
            try {
                const response = await fetch('/api/pegawai/profil');
                const result = await response.json();

                if (result.success) {
                    currentData = result.data;
                    displayProfil(result.data);
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Gagal memuat data profil', 'danger');
            }
        }

        function displayProfil(data) {
            const content = document.getElementById('profilContent');
            content.innerHTML = `
                <div class="text-center mb-4">
                    ${data.foto ? 
                        `<img src="${data.foto}" class="rounded-circle" width="150" height="150" style="object-fit: cover; border: 5px solid #2563eb;">` :
                        `<div style="width: 150px; height: 150px; background: linear-gradient(135deg, #2563eb, #3b82f6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: white; margin: 0 auto; border: 5px solid #2563eb;">👤</div>`
                    }
                </div>

                <form id="profilForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Foto Profil</label>
                        <input type="file" class="form-control" name="foto" accept="image/*">
                        <small class="text-muted">Format: JPG, PNG, GIF. Maksimal 5MB</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">NIP</label>
                        <input type="text" class="form-control" value="${data.nip}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="nama" value="${data.nama}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" name="email" value="${data.email}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Jabatan</label>
                        <input type="text" class="form-control" value="${data.jabatan || '-'}" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tanggal Bergabung</label>
                        <input type="text" class="form-control" value="${data.tanggal_bergabung ? formatTanggal(data.tanggal_bergabung) : '-'}" disabled>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            💾 Simpan Perubahan
                        </button>
                        <a href="/pegawai/dashboard" class="btn btn-outline-secondary">Kembali</a>
                    </div>
                </form>
            `;

            document.getElementById('profilForm').addEventListener('submit', updateProfil);
        }

        async function updateProfil(e) {
            e.preventDefault();

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/api/pegawai/profil', {
                    method: 'PUT',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Profil berhasil diupdate', 'success');
                    loadProfil();
                    loadUserInfo(); // Refresh navbar
                } else {
                    showAlert(result.message || 'Gagal update profil', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Terjadi kesalahan saat menyimpan data', 'danger');
            }
        }
    </script>
</body>
</html>
