<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password - Balai Bahasa Lampung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
               <a class="navbar-brand" href="/pegawai/dashboard">
                <img src="/img/logo.png" alt="Logo Balai Bahasa Lampung" class="brand-logo">
               
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/pegawai/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/profil">Profil</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/izin">Izin Keluar-Masuk</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pegawai/status">Status Izin</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/pegawai/ganti-password">Ganti Password</a></li>
                </ul>
                <div class="d-flex align-items-center ms-3" id="userInfo"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">🔒 Ganti Password</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>Tips Keamanan:</strong>
                            <ul class="mb-0 mt-2">
                                <li>Gunakan password minimal 6 karakter</li>
                                <li>Kombinasikan huruf, angka, dan simbol</li>
                                <li>Jangan gunakan password yang mudah ditebak</li>
                            </ul>
                        </div>

                        <form id="gantiPasswordForm">
                            <div class="mb-3">
                                <label class="form-label">Password Lama <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" name="passwordLama" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password Baru <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" name="passwordBaru" id="passwordBaru" required minlength="6">
                                <small class="text-muted">Minimal 6 karakter</small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Konfirmasi Password Baru <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" name="konfirmasiPassword" id="konfirmasiPassword" required minlength="6">
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    🔒 Ganti Password
                                </button>
                                <a href="/pegawai/dashboard" class="btn btn-outline-secondary">Kembali</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async function() {
            const user = await checkAuth();
            if (!user) {
                window.location.href = '/login';
                return;
            }
            
            loadUserInfo();
        });

        document.getElementById('gantiPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const passwordBaru = document.getElementById('passwordBaru').value;
            const konfirmasiPassword = document.getElementById('konfirmasiPassword').value;

            // Validasi
            if (passwordBaru !== konfirmasiPassword) {
                showAlert('Password baru dan konfirmasi password tidak sama', 'danger');
                return;
            }

            if (passwordBaru.length < 6) {
                showAlert('Password baru minimal 6 karakter', 'danger');
                return;
            }

            const formData = new FormData(this);
            const data = {
                passwordLama: formData.get('passwordLama'),
                passwordBaru: formData.get('passwordBaru')
            };

            try {
                const response = await fetch('/api/pegawai/ganti-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Password berhasil diubah! Silakan login ulang dengan password baru.', 'success');
                    setTimeout(() => {
                        logout();
                    }, 2000);
                } else {
                    showAlert(result.message || 'Gagal mengganti password', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Terjadi kesalahan saat mengganti password', 'danger');
            }
        });
    </script>
</body>
</html>
